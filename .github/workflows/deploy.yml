# Builds the site with Astro and publishes it to GitHub Pages.
#
# ⚠ ONE-TIME SETUP, done by a repository ADMIN:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Until that is changed, GitHub runs its legacy Jekyll builder against the raw
# source instead, which fails on Astro's `---` frontmatter.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        # `configure-pages` reports the real origin and sub-path this site is
        # served from, so the build matches wherever Pages puts it — a project
        # site (…/website/) or a custom domain at the root.
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
